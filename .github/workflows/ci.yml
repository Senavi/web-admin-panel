name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit, content and token checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version from package.json#packageManager before setup-node
      # (setup-node's pnpm cache needs pnpm on PATH).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm tokens:check
      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true
      # Blocking: a release must not ship a runtime dependency with a critical advisory.
      - name: Critical advisories in production dependencies (blocking)
        run: pnpm audit --prod --audit-level=critical

  build-without-env:
    name: Build without env (preview mode)
    runs-on: ubuntu-latest
    needs: checks
    # No database, secrets or site URL: a fresh Netlify/Vercel import must build and run.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds with an empty environment (`pnpm build`), starts it and runs tests/e2e-preview.
      - run: pnpm e2e:preview
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-preview
          path: playwright-report

  build-e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      STORAGE_DRIVER: local
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: 'true'
      E2E_BASE_URL: http://localhost:3100
      # Same test-only values as tests/e2e/support/env.ts.
      MAIL_PROVIDER: dev
      MAIL_FROM: Site Starter <forms@example.test>
      FORMS_WEBHOOK_SECRET: e2e-webhook-secret-0123456789
      CRON_SECRET: e2e-cron-secret-0123456789
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version from package.json#packageManager before setup-node
      # (setup-node's pnpm cache needs pnpm on PATH).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Session advisory locks need a real Postgres (PGlite has one session).
      - name: Deploy lock on Postgres
        run: pnpm exec vitest run tests/unit/deploy-lock-postgres.test.ts
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/app
      - run: pnpm e2e:prepare
      - run: pnpm build
      - run: pnpm check:bundles
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: pnpm start --port 3100 > server.log 2>&1 &
      - run: npx --yes wait-on@8 http://localhost:3100 --timeout 120000
      - run: pnpm e2e
      # The same build started as STAGING (runtime switch): never indexed, no tracking,
      # form emails to the team only, staging bar (tests/e2e-staging).
      - name: Restart as staging
        run: |
          pkill -f "next start" || true
          DEPLOYMENT_ENVIRONMENT=staging STAGING_MAIL_TO=staging-team@example.test pnpm start --port 3100 > server-staging.log 2>&1 &
      - run: npx --yes wait-on@8 http://localhost:3100 --timeout 120000
      - run: pnpm exec playwright test -c playwright.staging.config.ts
      - if: failure()
        run: cat server.log server-staging.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
