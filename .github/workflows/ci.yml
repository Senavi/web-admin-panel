name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  checks:
    name: Typecheck, lint, unit, content and token checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Dependency audit (non-blocking)
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  build-e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      STORAGE_DRIVER: local
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: 'true'
      E2E_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm e2e:prepare
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start production server
        run: pnpm start --port 3100 > server.log 2>&1 &
      - run: npx --yes wait-on@8 http://localhost:3100 --timeout 120000
      - run: pnpm e2e
      - if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
