# Netlify: the Next.js runtime is detected automatically (OpenNext adapter).
[build]
  # Migrations run only for production deploys (see docs/DEPLOYMENT.md § Preview deploys).
  command = "pnpm db:migrate:deploy && pnpm build"
  publish = ".next"

[functions]
  # Scheduled maintenance (analytics rollups, retention): netlify/functions/maintenance.mts
  directory = "netlify/functions"
